apiVersion: apps/v1

kind: Deployment

metadata:
  name: frontend-deployment
  namespace: oms

spec:
  replicas: 3

  selector:
    matchLabels:
      app: frontend-app

  template:
    metadata:
      labels:
        app: frontend-app

    spec:
      containers:
      - name: frontend-container
        image: gospelt14/oms-app-frontend:latest
        
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"

        ports:
        - containerPort: 3000
